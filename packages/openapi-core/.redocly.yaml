apis:
  identity:
    root: src/identity.yaml
  difficulty-policy:
    root: src/difficulty-policy.yaml
  block-observation:
    root: src/block-observation.yaml
  verification-result:
    root: src/verification-result.yaml
  fork-report:
    root: src/fork-report.yaml
  alert:
    root: src/alert.yaml
  audit-pack:
    root: src/audit-pack.yaml
  webhook:
    root: src/webhook.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
