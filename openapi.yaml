        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAlert
      tags:
      - Alerts
      summary: Create Alert
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeAlert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/alerts/{alertId}:
    parameters:
    - $ref: '#/components/parameters/AlertId'
    get:
      operationId: getAlert
      tags:
