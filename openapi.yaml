  /v1/fork-reports:
    get:
      operationId: listForkReports
      tags:
      - ForkReports
      summary: List ForkReport
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeForkReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createForkReport
      tags:
      - ForkReports
      summary: Create ForkReport
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkReportCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeForkReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/fork-reports/{forkId}:
    parameters:
    - $ref: '#/components/parameters/ForkId'
    get:
      operationId: getForkReport
      tags:
