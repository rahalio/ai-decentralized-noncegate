openapi: 3.0.3
info:
  title: Noncegate
  version: 0.1.0
  description: PoW difficulty policy and independent nonce verification control plane for consortium ledgers.
  x-product-slug: ai-decentralized-noncegate
  x-source: ai-in-decentralized+ai/proof-of-work/
servers:
- url: https://api.example.com
tags:
- name: DifficultyPolicies
  description: Versioned difficulty targets
- name: BlockObservations
  description: Ingested headers
- name: VerificationResults
  description: Independent PoW checks
- name: ForkReports
  description: Rewrite cost analysis
- name: Alerts
  description: Integrity anomalies
- name: AuditPacks
  description: Auditor evidence exports
paths:
  /v1/difficulty-policies:
    get:
      operationId: listDifficultyPolicies
      tags:
      - DifficultyPolicies
      summary: List DifficultyPolicy
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeDifficultyPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createDifficultyPolicy
      tags:
      - DifficultyPolicies
      summary: Create DifficultyPolicy
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DifficultyPolicyCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeDifficultyPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/difficulty-policies/{policyId}:
    parameters:
    - $ref: '#/components/parameters/PolicyId'
    get:
      operationId: getDifficultyPolicy
      tags:
      - DifficultyPolicies
      summary: Get DifficultyPolicy
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeDifficultyPolicy'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/difficulty-policies/{policyId}/approve:
    parameters:
    - $ref: '#/components/parameters/PolicyId'
    post:
      operationId: approveDifficultyPolicy
      tags:
      - DifficultyPolicies
      summary: Dual-control approve
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeDifficultyPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/block-observations:
    get:
      operationId: listBlockObservations
      tags:
      - BlockObservations
      summary: List BlockObservation
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelopeBlockObservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: ingestBlockObservation
      tags:
      - BlockObservations
      summary: Create BlockObservation
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockObservationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeBlockObservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/block-observations/{blockId}:
    parameters:
