    post:
      operationId: createVerificationResult
      tags:
      - VerificationResults
      summary: Create VerificationResult
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationResultCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeVerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/verification-results/{resultId}:
    parameters:
    - $ref: '#/components/parameters/ResultId'
    get:
      operationId: getVerificationResult
      tags:
