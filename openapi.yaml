components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
    ResultId:
      name: resultId
      in: path
      required: true
      schema:
        type: string
    ForkId:
      name: forkId
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
    PackId:
      name: packId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    DifficultyPolicy:
      type: object
      required:
      - id
      - version
      - difficulty
      - status
      - effectiveAt
      properties:
        id:
          type: string
        version:
          type: integer
        difficulty:
          type: integer
        leadingZeroTarget:
          type: integer
        status:
          type: string
          enum:
          - draft
          - approved
          - active
          - superseded
        effectiveAt:
          type: string
          format: date-time
    DifficultyPolicyCreate:
      type: object
      required:
      - difficulty
      - leadingZeroTarget
      - effectiveAt
      properties:
        version:
          type: integer
        difficulty:
          type: integer
        leadingZeroTarget:
          type: integer
        status:
          type: string
          enum:
          - draft
          - approved
          - active
          - superseded
        effectiveAt:
          type: string
          format: date-time
    DataEnvelopeDifficultyPolicy:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/DifficultyPolicy'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeDifficultyPolicy:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DifficultyPolicy'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BlockObservation:
      type: object
      required:
      - id
      - height
      - blockHash
      - parentHash
      - nonce
      - observedAt
      properties:
        id:
          type: string
        height:
          type: integer
        blockHash:
          type: string
        parentHash:
          type: string
        nonce:
          type: string
        observedAt:
          type: string
          format: date-time
        headerOnly:
          type: boolean
    BlockObservationCreate:
      type: object
      required:
      - height
      - blockHash
      - parentHash
      - nonce
      properties:
        height:
          type: integer
        blockHash:
          type: string
        parentHash:
          type: string
        nonce:
          type: string
        observedAt:
          type: string
          format: date-time
        headerOnly:
          type: boolean
    DataEnvelopeBlockObservation:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/BlockObservation'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeBlockObservation:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BlockObservation'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VerificationResult:
      type: object
      required:
      - id
      - blockId
      - policyId
      - valid
      - verifyDurationMs
      properties:
        id:
          type: string
        blockId:
          type: string
        policyId:
          type: string
        valid:
          type: boolean
        verifyDurationMs:
          type: integer
        failureReason:
          type: string
    VerificationResultCreate:
      type: object
      required:
      - blockId
      - policyId
      properties:
        blockId:
          type: string
        policyId:
          type: string
        valid:
          type: boolean
        verifyDurationMs:
          type: integer
        failureReason:
          type: string
    DataEnvelopeVerificationResult:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/VerificationResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeVerificationResult:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VerificationResult'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ForkReport:
      type: object
      required:
      - id
      - honestTipHash
      - candidateTipHash
      - workDifferential
      - status
      properties:
        id:
          type: string
        honestTipHash:
          type: string
        candidateTipHash:
          type: string
        workDifferential:
          type: number
        recomputeCostEstimate:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
          - falsePositive
    ForkReportCreate:
      type: object
      required:
      - honestTipHash
      - candidateTipHash
      - workDifferential
      properties:
        honestTipHash:
          type: string
        candidateTipHash:
          type: string
        workDifferential:
          type: number
        recomputeCostEstimate:
          type: string
        status:
          type: string
          enum:
          - open
          - resolved
          - falsePositive
    DataEnvelopeForkReport:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ForkReport'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeForkReport:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ForkReport'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Alert:
      type: object
      required:
      - id
      - alertType
      - severity
      - status
      - message
      properties:
        id:
          type: string
        alertType:
          type: string
          enum:
          - invalidNonce
          - policyDrift
          - hashRateCliff
          - forkDetected
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        status:
          type: string
          enum:
          - open
          - acked
          - closed
        message:
          type: string
    AlertCreate:
      type: object
      required:
      - alertType
      - severity
      - message
      properties:
        alertType:
          type: string
          enum:
          - invalidNonce
          - policyDrift
          - hashRateCliff
          - forkDetected
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        status:
          type: string
          enum:
          - open
          - acked
          - closed
        message:
          type: string
    DataEnvelopeAlert:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Alert'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeAlert:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AuditPack:
      type: object
      required:
      - id
      - periodStart
      - periodEnd
      - status
      - downloadUri
      properties:
        id:
          type: string
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - ready
          - failed
        downloadUri:
          type: string
          format: uri
    AuditPackCreate:
      type: object
      required:
      - periodStart
      - periodEnd
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - ready
          - failed
        downloadUri:
          type: string
          format: uri
    DataEnvelopeAuditPack:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/AuditPack'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeAuditPack:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditPack'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
